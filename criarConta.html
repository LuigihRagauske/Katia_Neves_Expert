<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criar conta — Kátia Neves Expert</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="criarConta.css">
</head>
<body>
<main class="card">
  <header class="top">
    <div class="avatar">KN</div>
    <h1>Criar conta</h1>
    <p>Kátia Neves Expert</p>
  </header>
  <div class="wave" aria-hidden="true">
    <svg viewBox="0 0 400 38" preserveAspectRatio="none"><path d="M0 0H400V18C360 26 330 10 280 10S200 38 140 32 S40 0 0 6Z" fill="#c88784"/></svg>
  </div>
  <div class="form">
    <p class="label">Eu sou</p>
    <div class="roles">
      <button class="role on" type="button">Mãe, pai ou responsável</button>
      <button class="role" type="button">Professor(a) ou educador(a)</button>
    </div>

    <div class="field">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <input id="n" type="text" placeholder=" " autocomplete="off"><label for="n">Nome</label>
    </div>
    <div class="field">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
      <input id="e" type="email" placeholder=" " autocomplete="off"><label for="e">E-mail</label>
    </div>
    <div class="field">
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="s" type="password" placeholder=" " autocomplete="off"><label for="s">Senha</label>
      <button class="eye" type="button" aria-label="Mostrar senha"><svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 004.2 4.2"/></svg></button>
    </div>
    <div class="field">
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <input id="c" type="password" placeholder=" " autocomplete="off"><label for="c">Confirmar senha</label>
      <button class="eye" type="button" aria-label="Mostrar senha"><svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 004.2 4.2"/></svg></button>
    </div>

    <label class="check"><input type="checkbox"><span>Li e aceito os termos e a política de privacidade</span></label>
    <button class="btn" type="button">Criar conta</button>
    <a class="link" href="#">Já tenho conta</a>
  </div>
</main>
<script src="criarConta.js"></script>
</body>
</html>
