<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nova senha — Kátia Neves Expert</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <main class="card">
      <header class="top">
        <div class="avatar">
          <svg viewBox="0 0 60 60" aria-label="Paraquedas">
            <path d="M4 26C8 10 30 2 46 10c10 6 10 18 6 28Q44 32 36 34Q26 30 16 32Q9 28 4 26Z" fill="#990000"/>
            <path d="M18 28C22 16 34 11 44 13c5 6 4 15 3 21Q40 30 32 32Q25 29 18 28Z" fill="#ad3131"/>
            <path d="M4 26L16 32L14 54ZM16 32L36 34L14 54ZM36 34L52 38L14 54Z" fill="#fff" stroke="#000" stroke-width=".8" stroke-linejoin="round"/>
            <path d="M14 54l-3-3 4-1Z" fill="#000"/>
          </svg>
        </div>
        <h1>Nova senha</h1>
        <p>Kátia Neves Expert</p>
      </header>

      <div class="wave" aria-hidden="true">
        <svg viewBox="0 0 400 38" preserveAspectRatio="none">
          <path d="M0 0H400V18C360 26 330 10 280 10S200 38 140 32 S40 0 0 6Z" fill="#c88784"/>
        </svg>
      </div>

      <form class="form" id="form" novalidate>
        <p class="texto">Escolha uma nova senha para a sua conta.</p>

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24">
            <rect x="5" y="11" width="14" height="10" rx="3"/>
            <path d="M8 11V8a4 4 0 018 0v3"/>
          </svg>
          <input id="senha" type="password" placeholder=" " autocomplete="new-password">
          <label for="senha">Nova senha</label>
          <button class="eye" type="button" aria-label="Mostrar senha">
            <svg class="on" viewBox="0 0 24 24">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="off" viewBox="0 0 24 24">
              <path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 004.2 4.2"/>
            </svg>
          </button>
        </div>

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24">
            <rect x="5" y="11" width="14" height="10" rx="3"/>
            <path d="M8 11V8a4 4 0 018 0v3"/>
          </svg>
          <input id="confirmar" type="password" placeholder=" " autocomplete="new-password">
          <label for="confirmar">Confirmar nova senha</label>
          <button class="eye" type="button" aria-label="Mostrar senha">
            <svg class="on" viewBox="0 0 24 24">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="off" viewBox="0 0 24 24">
              <path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 004.2 4.2"/>
            </svg>
          </button>
        </div>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
        <button class="btn" id="botao" type="submit">Salvar nova senha</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="supabaseClient.js"></script>
    <script src="comum.js"></script>
    <script src="redefinirSenha.js"></script>
  </body>
</html>
