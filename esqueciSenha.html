<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Esqueceu a senha — Kátia Neves Expert</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="CSS/style.css">
  </head>
  <body>
    <main class="card">
      <header class="top">
        <div class="avatar">
          <svg viewBox="0 0 60 60" aria-label="Paraquedas">
            <path d="M4 26C8 10 30 2 46 10c10 6 10 18 6 28Q44 32 36 34Q26 30 16 32Q9 28 4 26Z" fill="#990000"/>
            <path d="M18 28C22 16 34 11 44 13c5 6 4 15 3 21Q40 30 32 32Q25 29 18 28Z" fill="#ad3131"/>
            <path d="M4 26L16 32L14 54ZM16 32L36 34L14 54ZM36 34L52 38L14 54Z" fill="#fff" stroke="#000" stroke-width=".8" stroke-linejoin="round"/>
            <path d="M14 54l-3-3 4-1Z" fill="#000"/>
          </svg>
        </div>
        <h1>Esqueceu a senha?</h1>
        <p>Kátia Neves Expert</p>
      </header>

      <div class="wave" aria-hidden="true">
        <svg viewBox="0 0 400 38" preserveAspectRatio="none">
          <path d="M0 0H400V18C360 26 330 10 280 10S200 38 140 32 S40 0 0 6Z" fill="#c88784"/>
        </svg>
      </div>

      <form class="form" id="form" novalidate>
        <p class="texto">Digite o e-mail da sua conta e enviaremos um link para você criar uma nova senha.</p>

        <div class="field">
          <svg class="ic" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="M4 7l8 6 8-6"/>
          </svg>
          <input id="email" type="email" placeholder=" " autocomplete="email">
          <label for="email">E-mail</label>
        </div>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
        <button class="btn" id="botao" type="submit">Enviar link</button>
        <a class="link" href="index.html">Voltar para o login</a>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="JS/supabaseClient.js"></script>
    <script src="JS/comum.js"></script>
    <script src="JS/esqueciSenha.js"></script>
  </body>
</html>
